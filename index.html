<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Kuis Interaktif IPS Kelas IX - ASTS 2026</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-text: #2c3e50;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f5;
            color: var(--dark-text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            padding: 30px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--secondary-color);
            transition: width 0.3s ease;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: #555;
        }

        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: var(--light-bg);
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 18px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            color: var(--dark-text);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e8f4fc;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--danger-color) !important;
            color: #721c24;
        }

        .explanation-box {
            background-color: #eef7fe;
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            font-size: 0.95rem;
        }

        .explanation-box h4 {
            color: var(--secondary-color);
            margin-bottom: 5px;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            background-color: var(--secondary-color);
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .result-box {
            text-align: center;
            display: none;
        }

        .result-box h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 15px 0;
        }

        .result-details {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .review-item {
            text-align: left;
            background: var(--light-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--secondary-color);
        }

        .review-item.correct-item {
            border-left-color: var(--success-color);
        }

        .review-item.incorrect-item {
            border-left-color: var(--danger-color);
        }

        .review-q {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .review-a {
            font-size: 0.9rem;
            margin-bottom: 3px;
        }

        .review-exp {
            font-size: 0.85rem;
            color: #555;
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.4rem;
            }
            .question-box {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kuis Interaktif IPS Kelas IX</h1>
        <p>Materi ASTS 2026: Perubahan Sosial, Modernisasi, Globalisasi, & Kearifan Lokal</p>
    </header>

    <div id="quiz-screen">
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="quiz-header">
            <span id="question-number">Soal 1 dari 10</span>
            <span id="score-count">Skor: 0</span>
        </div>

        <div class="question-box" id="question-text"></div>

        <div class="options-container" id="options-container"></div>

        <div class="explanation-box" id="explanation-box">
            <h4>Pembahasan Singkat:</h4>
            <p id="explanation-text"></p>
        </div>

        <div class="footer-nav">
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Lanjut</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <h2>Hasil Kuis Anda</h2>
        <div class="score-display" id="final-score">0</div>
        <p class="result-details" id="result-summary"></p>
        
        <button class="btn" onclick="restartQuiz()" style="margin-bottom: 25px;">Ulangi Kuis</button>
        
        <h3 style="text-align: left; margin-bottom: 15px; color: var(--primary-color);">Review Soal & Pembahasan</h3>
        <div id="review-container"></div>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Menurut Selo Soemardjan, apakah yang dimaksud dengan perubahan sosial?",
            options: [
                "Proses pergeseran budaya barat yang diadopsi secara langsung oleh masyarakat",
                "Perubahan pada lembaga kemasyarakatan yang mempengaruhi sistem sosial, nilai, dan pola perilaku",
                "Perubahan kondisi fisik bumi yang mempengaruhi mata pencaharian penduduk",
                "Proses modernisasi teknologi dari peralatan tradisional menjadi serba otomatis"
            ],
            answer: 1,
            explanation: "Selo Soemardjan menyatakan perubahan sosial adalah perubahan pada lembaga-lembaga kemasyarakatan di dalam suatu masyarakat yang mempengaruhi sistem sosialnya, termasuk nilai-nilai, sikap, dan pola perilaku di antara kelompok-kelompok masyarakat."
        },
        {
            question: "Manakah contoh perubahan sosial yang tergolong ke dalam perubahan yang direncanakan (planned change)?",
            options: [
                "Bencana alam banjir yang memaksa warga berpindah pekerjaan",
                "Pembangunan jalan tol dan penetapan program Keluarga Berencana (KB) oleh pemerintah",
                "Perubahan tren gaya rambut dan model pakaian di kalangan remaja",
                "Krisis ekonomi global yang memicu lonjakan angka pengangguran"
            ],
            answer: 1,
            explanation: "Planned change merupakan perubahan yang disengaja atau direncanakan oleh pihak tertentu yang dinamakan agen perubahan (Agent of Change), seperti pembangunan jalan tol dan program KB."
        },
        {
            question: "Perkembangan teknologi seperti inovasi otomatisasi mesin dan robotik menggeser peran tenaga manusia. Hal ini termasuk faktor penyebab perubahan sosial yang bersifat...",
            options: [
                "Internal dari penemuan baru (inovasi)",
                "Eksternal dari bencana alam",
                "Eksternal dari peperangan",
                "Internal dari konflik horizontal"
            ],
            answer: 0,
            explanation: "Penemuan baru (inovasi) berupa perkembangan IPTEK, otomatisasi mesin, dan robotik merupakan salah satu faktor internal penyebab perubahan sosial dari dalam masyarakat."
        },
        {
            question: "Apakah yang menjadi ciri utama dari pola pikir masyarakat modern?",
            options: [
                "Menolak segala fenomena baru karena takut merusak tradisi lama",
                "Berpikir rasional, ilmiah, terbuka (open minded), serta mengutamakan efisiensi dan efektivitas kerja",
                "Menggantungkan seluruh keputusan hidup pada takhayul dan kepercayaan mistis",
                "Meniru seluruh gaya hidup dan cara berpakaian masyarakat barat secara mentah-mentah"
            ],
            answer: 1,
            explanation: "Ciri modernisasi adalah memiliki pola pikir rasional dan ilmiah, terbuka terhadap hal baru, serta menerapkan teknologi untuk efektivitas dan efisiensi kerja."
        },
        {
            question: "Apa perbedaan mendasar antara konsep Modernisasi dan Westernisasi?",
            options: [
                "Modernisasi meniru gaya hidup barat, sedangkan westernisasi berfokus pada teknologi ilmiah",
                "Modernisasi menekankan pola pikir rasional dan efisiensi tanpa membuang budaya lokal, sedangkan westernisasi meniru gaya hidup barat secara mentah-mentah",
                "Modernisasi hanya terjadi di kota, sedangkan westernisasi terjadi di desa",
                "Modernisasi merusak kearifan lokal, sedangkan westernisasi memperkuat tradisi"
            ],
            answer: 1,
            explanation: "Kesalahpahaman sering menganggap modernisasi sama dengan westernisasi. Modernisasi mengadopsi ilmu pengetahuan dan teknologi demi efisiensi tanpa membuang tradisi, sedangkan westernisasi adalah meniru budaya/gaya hidup barat secara langsung."
        },
        {
            question: "Berikut ini yang merupakan contoh modernisasi dalam kehidupan masyarakat pedesaan adalah...",
            options: [
                "Meninggalkan sektor pertanian untuk menjadi buruh tidak tetap di kota",
                "Penggunaan mesin traktor untuk membajak sawah dan pembayaran transaksi via QRIS",
                "Menjual hasil panen secara tradisional tanpa bantuan alat ukur",
                "Mengganti seluruh lahan pertanian dengan kawasan tempat hiburan"
            ],
            answer: 1,
            explanation: "Penerapan modernisasi di desa terlihat dari penggunaan traktor menggantikan kerbau serta penerapan transaksi digital seperti QRIS untuk mempermudah kegiatan ekonomi."
        },
        {
            question: "Maraknya iklan menarik di media sosial serta kemudahan belanja online melalui e-commerce berisiko tinggi memicu perilaku...",
            options: [
                "Konsumerisme",
                "Individualisme",
                "Sekularisme",
                "Gotong royong"
            ],
            answer: 0,
            explanation: "Kemudahan transaksi belanja online dan gempuran iklan media sosial dapat mendorong timbulnya konsumerisme atau kebiasaan membeli barang secara berlebihan."
        },
        {
            question: "Pandangan hidup yang menganggap bahwa kesenangan dan kenikmatan materi merupakan tujuan utama dalam kehidupan disebut...",
            options: [
                "Westernisasi",
                "Hedonisme",
                "Akulturasi",
                "Modernisme"
            ],
            answer: 1,
            explanation: "Hedonisme adalah pandangan hidup yang mengukur tujuan utama hidup berdasarkan kesenangan materi dan kenikmatan pribadi."
        },
        {
            question: "Tradisi simpanan lumbung padi pada masyarakat Baduy merupakan contoh kearifan lokal yang berfungsi untuk...",
            options: [
                "Menjual pasokan beras ke luar negeri untuk keuntungan pribadi",
                "Menjaga ketahanan pangan masyarakat serta wujud kearifan menjaga keseimbangan alam",
                "Mengikuti seluruh instruksi modernisasi dari agen perubahan luar",
                "Menghilangkan tradisi pertanian tradisional Baduy secara perlahan"
            ],
            answer: 1,
            explanation: "Lumbung padi Baduy bertujuan menjaga ketahanan pangan masyarakat serta bentuk kearifan lokal dalam memelihara keseimbangan lingkungan alam secara bijaksana."
        },
        {
            question: "Bagaimanakah keterkaitan antara Perubahan Sosial, Modernisasi, dan Kearifan Lokal?",
            options: [
                "Perubahan sosial adalah prosesnya, Modernisasi adalah arah kemajuannya, dan Kearifan Lokal adalah benteng penyeimbangnya",
                "Perubahan sosial dan Modernisasi harus memusnahkan seluruh Kearifan Lokal yang ada",
                "Kearifan Lokal adalah prosesnya, Modernisasi adalah penghambatnya, dan Perubahan Sosial hasilnya",
                "Ketiganya tidak memiliki hubungan apapun dalam kehidupan bermasyarakat"
            ],
            answer: 0,
            explanation: "Sintesis dari ketiga konsep ini: Perubahan sosial merupakan proses dinamika masyarakat, Modernisasi sebagai arah menuju efisiensi/kemajuan, dan Kearifan Lokal menjadi benteng penyeimbang agar identitas bangsa tetap terjaga."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    const questionNumberEl = document.getElementById("question-number");
    const scoreCountEl = document.getElementById("score-count");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const explanationBoxEl = document.getElementById("explanation-box");
    const explanationTextEl = document.getElementById("explanation-text");
    const progressBarEl = document.getElementById("progress-bar");
    const nextBtn = document.getElementById("next-btn");

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];
        quizScreen.style.display = "block";
        resultScreen.style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = quizData[currentQuestionIndex];
        
        questionNumberEl.innerText = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
        scoreCountEl.innerText = `Skor: ${score}`;
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;

        questionTextEl.innerText = q.question;

        q.options.forEach((opt, idx) => {
            const button = document.createElement("button");
            button.innerText = opt;
            button.classList.add("option-btn");
            button.onclick = () => selectAnswer(idx);
            optionsContainerEl.appendChild(button);
        });
    }

    function resetState() {
        nextBtn.disabled = true;
        explanationBoxEl.style.display = "none";
        optionsContainerEl.innerHTML = "";
    }

    function selectAnswer(selectedIdx) {
        const q = quizData[currentQuestionIndex];
        const buttons = optionsContainerEl.children;

        userAnswers.push({
            question: q.question,
            selected: selectedIdx,
            correct: q.answer,
            explanation: q.explanation
        });

        if (selectedIdx === q.answer) {
            score += 10;
            buttons[selectedIdx].classList.add("correct");
        } else {
            buttons[selectedIdx].classList.add("incorrect");
            buttons[q.answer].classList.add("correct");
        }

        for (let btn of buttons) {
            btn.disabled = true;
        }

        explanationTextEl.innerText = q.explanation;
        explanationBoxEl.style.display = "block";

        scoreCountEl.innerText = `Skor: ${score}`;
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";

        progressBarEl.style.width = `100%`;

        const maxScore = quizData.length * 10;
        document.getElementById("final-score").innerText = `${score} / ${maxScore}`;

        let summaryText = "";
        if (score >= 80) {
            summaryText = "Sangat Baik! Pemahaman materi IPS Anda sudah sangat matang.";
        } else if (score >= 60) {
            summaryText = "Cukup Baik! Pelajari kembali pembahasan di bawah untuk meningkatkan nilai.";
        } else {
            summaryText = "Tetap semangat! Pelajari kembali ringkasan materi dan coba ulangi kuis ini.";
        }
        document.getElementById("result-summary").innerText = summaryText;

        const reviewContainer = document.getElementById("review-container");
        reviewContainer.innerHTML = "";

        userAnswers.forEach((ans, i) => {
            const isCorrect = ans.selected === ans.correct;
            const reviewDiv = document.createElement("div");
            reviewDiv.classList.add("review-item");
            reviewDiv.classList.add(isCorrect ? "correct-item" : "incorrect-item");

            const userChoiceText = quizData[i].options[ans.selected];
            const correctChoiceText = quizData[i].options[ans.correct];

            reviewDiv.innerHTML = `
                <div class="review-q">${i + 1}. ${ans.question}</div>
                <div class="review-a"><strong>Jawaban Anda:</strong> ${userChoiceText} ${isCorrect ? "✅" : "❌"}</div>
                ${!isCorrect ? `<div class="review-a" style="color: #27ae60;"><strong>Jawaban Benar:</strong> ${correctChoiceText}</div>` : ""}
                <div class="review-exp"><strong>Pembahasan:</strong> ${ans.explanation}</div>
            `;
            reviewContainer.appendChild(reviewDiv);
        });
    }

    function restartQuiz() {
        startQuiz();
    }

    window.onload = startQuiz;
</script>

</body>
</html>
